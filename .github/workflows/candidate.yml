name: candidate-validation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: engram_candidate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d engram_candidate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false
      - name: Prepare exact upstream and Electus overlays
        shell: bash
        run: |
          git clone --depth 1 --branch v3.0.0 https://github.com/Gentleman-Programming/engram.git upstream
          test "$(git -C upstream rev-parse HEAD)" = 15a2f78885d7ad8ced23b2d1d88383e9bb472c17
          cp tests/electus_patch_test.go upstream/internal/cloud/cloudstore/
          cp tests/store_cleanup_test.go upstream/internal/store/electus_cleanup_test.go
          cd upstream
          # v3.0.0 fixes issued_token upstream (auditKeyValueExempt): the regression must PASS with no sed.
          if grep -q 'key == "issued_token"' internal/cloud/cloudstore/identity.go; then
            echo 'Unexpected issued_token source patch in the upstream checkout'
            exit 1
          fi
          go test ./internal/cloud/cloudstore -run TestElectusIssuedTokenAuditMetadata -count=1
          # v3.0.0 closes the store on constructor failure: the regression must PASS with no Electus patch.
          go test ./internal/store -run TestElectusConstructorClosesDatabaseOnFailure -count=1
          # relations-fixture, store-constructor-cleanup and windows-test-fixtures left: v3.0.0 ships equivalent code.
          cp ../tests/health_metadata.go internal/cloud/cloudserver/electus_metadata.go
          cp ../tests/health_metadata_test.go internal/cloud/cloudserver/electus_metadata_test.go
          git apply --check ../tests/health-metadata.patch
          git apply ../tests/health-metadata.patch
      - name: Cloud, SQLite and MCP compatibility with ephemeral Postgres
        working-directory: upstream
        env:
          CLOUDSTORE_TEST_DSN: postgres://postgres@127.0.0.1:5432/engram_candidate?sslmode=disable
        run: go test ./internal/cloud/... ./internal/store ./internal/mcp -count=1 -timeout=10m
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag engram-candidate:241 .
      - run: test "$(docker run --rm engram-candidate:241 version)" = "engram v3.0.0-electus-patch3"
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: false
      - name: Windows suite and Windows/Linux builds
        shell: pwsh
        run: ./validate-candidate.ps1 -GoBinary (Get-Command go).Source
      - name: Keep Windows test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-go-tests
          path: artifacts/go-tests*.jsonl
          retention-days: 7
